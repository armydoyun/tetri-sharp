name: ci

# 모든 브랜치의 push와 PR마다 실행한다. Actions 탭의 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
on:
  push:
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 러너는 ubuntu-24.04로 고정한다. Playwright 1.48의 install --with-deps가 지원하는 배포판이 24.04까지다.
jobs:
  # 정적 검사. 테스트와 따로 돌려서 lint가 실패해도 테스트 결과는 볼 수 있다.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  # unit    Node만으로 도는 코어·규칙·빌드 도구 테스트
  # browser 한 파일 배포본을 실제 Chromium으로 열어 보는 테스트
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, browser]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci --no-audit --no-fund

      # Chromium 내려받기는 Playwright 버전(lock 파일)이 같으면 캐시에서 꺼낸다. 시스템 라이브러리는 매번 설치한다.
      - name: Cache Playwright browsers
        if: matrix.suite == 'browser'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: matrix.suite == 'browser'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}

  # lint와 테스트가 모두 통과하면 한 파일짜리 배포본을 만들어 실행 페이지의 Artifacts에 올린다.
  # 이름에 커밋 SHA를 붙여 어느 소스에서 만든 파일인지 알 수 있게 한다.
  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build single-file deploy
        run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: tetri-sharp-${{ github.sha }}
          path: deploy/index.html
          if-no-files-found: error
