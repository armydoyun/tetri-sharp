<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="Tetri# — 규칙을 직접 조합하는 낙하 블록 퍼즐." />
    <title>Tetri#</title>
    <!-- 스타일시트: 위에서 아래 순서가 곧 우선순위. 빌드는 이 순서대로 이어 붙인다(tools/build.mjs). -->
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/game.css">
  </head>
  <body>
    <main id="app" class="app">
      <header class="app-header">
        <h1 class="logo">Tetri<span class="logo-sharp">#</span></h1>
      </header>
      <section class="stage" aria-label="게임 화면">
        <div class="board-wrap">
          <canvas id="board" class="board" aria-label="보드"></canvas>
          <div id="overlay" class="overlay" role="status" hidden></div>
        </div>
        <dl class="hud">
          <div><dt>시간</dt><dd id="hud-time">0:00.00</dd></div>
          <div><dt>줄</dt><dd id="hud-lines">0</dd></div>
          <div><dt>피스</dt><dd id="hud-pieces">0</dd></div>
          <div><dt>PPS</dt><dd id="hud-pps">0.00</dd></div>
        </dl>
      </section>
      <p class="keys">← → 이동 · ↓ 소프트 드롭 · Space 하드 드롭 · ↑/X 회전 · Z 반대 회전 · A 180° · C/Shift 홀드 · Esc 일시정지 · R 재시작</p>
    </main>
    <!-- ES Modules: 개발용 실행은 http://localhost를 사용한다. -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
