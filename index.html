<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="Tetri# — 규칙을 직접 조합하는 낙하 블록 퍼즐." />
    <title>Tetri#</title>
    <!-- 스타일시트: 위에서 아래 순서가 곧 우선순위. 빌드는 이 순서대로 이어 붙인다(tools/build.mjs). -->
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/game.css">
  </head>
  <body>
    <main id="app" class="app">
      <header class="app-header">
        <h1 class="logo">Tetri<span class="logo-sharp">#</span></h1>
        <button id="open-settings" class="btn btn-ghost" type="button">설정</button>
      </header>
      <section class="stage" aria-label="게임 화면">
        <div class="board-wrap">
          <canvas id="board" class="board" aria-label="보드"></canvas>

          <div id="menu" class="panel" hidden>
            <div class="rule-bar">
              <div id="rule-tabs" class="rule-tabs" role="group" aria-label="규칙"></div>
              <button id="edit-rules" type="button" class="btn btn-small" hidden>규칙 편집</button>
            </div>
            <h2 class="panel-title">모드 선택</h2>
            <div id="mode-list" class="mode-list"></div>
            <div class="replay-actions">
              <button id="watch-last" type="button" class="btn btn-small">마지막 판 리플레이</button>
              <button id="open-replay" type="button" class="btn btn-small">리플레이 파일 열기</button>
              <input id="replay-file" type="file" accept=".json,application/json" hidden />
            </div>
            <p id="menu-notice" class="menu-notice" role="status" hidden></p>
          </div>

          <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
          <div id="action" class="action" aria-live="polite"></div>

          <div id="pause" class="panel" hidden>
            <h2 class="panel-title">일시정지</h2>
            <div class="actions">
              <button type="button" class="btn btn-primary" data-action="resume">계속 <kbd>Esc</kbd></button>
              <button type="button" class="btn" data-action="retry">다시 시작 <kbd data-key="RESTART"></kbd></button>
              <button type="button" class="btn" data-action="menu">메뉴로</button>
            </div>
          </div>

          <div id="results" class="panel" tabindex="-1" hidden>
            <p id="results-mode" class="results-mode"></p>
            <h2 id="results-title" class="panel-title"></h2>
            <p id="results-main" class="results-main"></p>
            <p id="results-badge" class="badge" hidden>새 기록!</p>
            <dl id="results-stats" class="results-stats"></dl>
            <div class="actions">
              <button type="button" class="btn btn-primary" data-action="retry">다시 하기 <kbd data-key="RESTART"></kbd></button>
              <button type="button" class="btn" data-action="menu">메뉴로 <kbd>Esc</kbd></button>
              <div class="actions-row">
                <button type="button" class="btn btn-small" data-action="watch">리플레이 보기</button>
                <button type="button" class="btn btn-small" data-action="export">파일로 저장</button>
              </div>
            </div>
          </div>

          <div id="replay-bar" class="replay-bar" hidden>
            <span class="replay-tag">REPLAY</span>
            <span id="replay-title" class="replay-title"></span>
            <span id="replay-status" class="replay-status"></span>
            <span class="replay-buttons">
              <button type="button" class="btn btn-small" data-replay="toggle">일시정지</button>
              <button type="button" class="btn btn-small" data-replay="speed">×1</button>
              <button type="button" class="btn btn-small" data-replay="restart">처음부터</button>
              <button type="button" class="btn btn-small" data-replay="exit">닫기 <kbd>Esc</kbd></button>
            </span>
          </div>
        </div>
        <dl class="hud">
          <div><dt id="hud-time-label">시간</dt><dd id="hud-time">0:00.00</dd></div>
          <div><dt>점수</dt><dd id="hud-score">0</dd></div>
          <div><dt>레벨</dt><dd id="hud-level">1</dd></div>
          <div><dt id="hud-lines-label">줄</dt><dd id="hud-lines">0</dd></div>
          <div><dt>피스</dt><dd id="hud-pieces">0</dd></div>
          <div><dt>PPS</dt><dd id="hud-pps">0.00</dd></div>
        </dl>
      </section>
      <p id="key-help" class="keys"></p>
    </main>
    <dialog id="settings" class="settings" aria-label="설정"></dialog>
    <dialog id="rules-editor" class="settings" aria-label="Custom 규칙"></dialog>
    <!-- ES Modules: 개발용 실행은 http://localhost를 사용한다. -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
