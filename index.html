<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tetri# — 규칙을 직접 조합하는 낙하 블록 퍼즐." />
    <title>Tetri#</title>
    <!-- 스타일시트: 위에서 아래 순서가 곧 우선순위. 빌드는 이 순서대로 이어 붙인다(tools/build.mjs). docs/DESIGN_SYSTEM.md -->
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/game.css">
  </head>
  <body>
    <main id="app" class="app">
      <header class="app-header">
        <h1 class="logo">Tetri<span class="logo-sharp">#</span></h1>
        <button id="open-settings" class="btn btn-ghost" type="button"><span data-icon="sliders"></span>설정</button>
      </header>
      <section class="stage" aria-label="게임 화면">
        <!-- 게임 화면: 테마와 무관하게 항상 다크 -->
        <div class="board-wrap surface-game">
          <canvas id="board" class="board" aria-label="보드"></canvas>

          <div id="menu" class="panel" hidden>
            <div class="rule-bar">
              <div id="rule-tabs" class="segmented" role="group" aria-label="규칙"></div>
              <button id="edit-rules" type="button" class="btn btn-small" title="Custom 규칙 편집">
                <span data-icon="edit"></span>편집
              </button>
            </div>
            <h2 class="panel-title">모드 선택</h2>
            <div id="mode-list" class="mode-list"></div>
            <div class="replay-actions">
              <button id="open-records" type="button" class="btn btn-small"><span data-icon="trophy"></span>기록</button>
              <button id="watch-last" type="button" class="btn btn-small"><span data-icon="play"></span>마지막 판</button>
              <button id="open-replay" type="button" class="btn btn-small"><span data-icon="folder"></span>파일 열기</button>
              <input id="replay-file" type="file" accept=".json,application/json" hidden />
            </div>
            <p id="menu-notice" class="notice-slot menu-notice" role="status"></p>
          </div>

          <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
          <div id="action" class="action" aria-live="polite"></div>

          <div id="pause" class="panel" hidden>
            <h2 class="panel-title">일시정지</h2>
            <div class="actions">
              <button type="button" class="btn btn-primary" data-action="resume"><span data-icon="play"></span>계속 <kbd><kbd class="keycap">Esc</kbd></kbd></button>
              <button type="button" class="btn" data-action="retry"><span data-icon="restart"></span>다시 시작 <kbd data-key="RESTART"></kbd></button>
              <button type="button" class="btn" data-action="menu"><span data-icon="menu"></span>메뉴로</button>
            </div>
          </div>

          <div id="results" class="panel" tabindex="-1" hidden>
            <p id="results-mode" class="results-mode"></p>
            <h2 id="results-title" class="panel-title"></h2>
            <p id="results-main" class="results-main"></p>
            <!-- 새 기록일 때만 보이지만 자리는 늘 차지한다(원칙 2) -->
            <p id="results-badge" class="badge is-invisible"><span data-icon="star"></span>새 기록</p>
            <dl id="results-stats" class="results-stats"></dl>
            <div class="actions">
              <button type="button" class="btn btn-primary" data-action="retry"><span data-icon="restart"></span>다시 하기 <kbd data-key="RESTART"></kbd></button>
              <button type="button" class="btn" data-action="menu"><span data-icon="menu"></span>메뉴로 <kbd><kbd class="keycap">Esc</kbd></kbd></button>
              <div class="actions-row">
                <button type="button" class="btn btn-small" data-action="stats"><span data-icon="chart"></span>통계</button>
                <button type="button" class="btn btn-small" data-action="watch"><span data-icon="play"></span>리플레이</button>
                <button type="button" class="btn btn-small" data-action="export"><span data-icon="download"></span>저장</button>
              </div>
            </div>
          </div>

          <div id="replay-bar" class="replay-bar" hidden>
            <span class="replay-tag">REPLAY</span>
            <span id="replay-title" class="replay-title"></span>
            <span id="replay-status" class="replay-status"></span>
            <span class="replay-buttons">
              <button type="button" class="btn btn-small" data-replay="toggle" aria-label="일시정지"><span data-icon="pause"></span></button>
              <button type="button" class="btn btn-small num" data-replay="speed" aria-label="재생 속도"><span data-icon="forward"></span><span class="replay-speed">1x</span></button>
              <button type="button" class="btn btn-small" data-replay="restart" aria-label="처음부터"><span data-icon="restart"></span></button>
              <button type="button" class="btn btn-small" data-replay="exit" aria-label="닫기"><span data-icon="close"></span></button>
            </span>
          </div>
        </div>
        <dl class="hud">
          <div><dt id="hud-time-label">시간</dt><dd id="hud-time">0:00.00</dd></div>
          <div><dt>점수</dt><dd id="hud-score">0</dd></div>
          <div><dt>레벨</dt><dd id="hud-level">1</dd></div>
          <div><dt id="hud-lines-label">줄</dt><dd id="hud-lines">0</dd></div>
          <div><dt>피스</dt><dd id="hud-pieces">0</dd></div>
          <div><dt>PPS</dt><dd id="hud-pps">0.00</dd></div>
          <div><dt>PB 대비</dt><dd id="hud-split" class="hud-split">—</dd></div>
        </dl>
      </section>
      <p id="key-help" class="keys" aria-label="조작 안내"></p>
    </main>
    <dialog id="settings" class="dialog" aria-label="설정"></dialog>
    <dialog id="rules-editor" class="dialog" aria-label="Custom 규칙"></dialog>
    <dialog id="records" class="dialog dialog-wide" aria-label="기록"></dialog>
    <dialog id="stats" class="dialog dialog-wide" aria-label="이번 판 통계"></dialog>
    <!-- ES Modules: 개발용 실행은 http://localhost를 사용한다. -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
