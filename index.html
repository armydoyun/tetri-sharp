<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171a17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tetri# — 규칙을 직접 조합하는 낙하 블록 퍼즐." />
    <title>Tetri#</title>
    <!-- 스타일시트: 위에서 아래 순서가 곧 우선순위. 빌드는 이 순서대로 이어 붙인다(tools/build.mjs). docs/DESIGN_SYSTEM.md -->
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/game.css">
  </head>
  <body>
    <main id="app" class="app">
      <header class="app-header">
        <h1 class="logo">
          <button id="go-home" class="logo-btn" type="button" title="첫 화면으로"><span class="logo-mark" aria-hidden="true"></span>Tetri#</button>
        </h1>
        <p id="session-title" class="session-title"></p>
        <div class="header-actions">
          <button id="pause-game" class="btn btn-ghost" type="button" aria-label="일시정지"><span data-icon="pause"></span></button>
          <button id="open-settings" class="btn btn-ghost" type="button"><span data-icon="sliders"></span>설정</button>
        </div>
      </header>
      <!-- 첫 화면: 보드 위 덮개가 아닌 독립된 화면. 넓은 화면에서는 넓게 쓴다 -->
      <!-- 첫 화면: 게임 메뉴. 넓으면 [규칙·모드 | 도구] 두 칸, 좁으면 한 칸 -->
      <section id="menu" class="home" aria-label="첫 화면" hidden>
        <div class="home-main">
          <section class="home-block rule-card" aria-labelledby="rules-title">
            <div class="block-head">
              <h2 id="rules-title" class="section-title">규칙</h2>
              <button id="edit-rules" type="button" class="btn btn-small" title="Custom 규칙 편집">
                <span data-icon="edit"></span>편집
              </button>
            </div>
            <div id="rule-tabs" class="segmented rule-tabs" role="group" aria-label="규칙"></div>
            <!-- 고른 규칙 설명: 두 줄 자리를 늘 차지한다 -->
            <p id="rule-desc" class="rule-desc"></p>
          </section>

          <section class="home-block home-modes" aria-labelledby="mode-title">
            <div class="block-head">
              <h2 id="mode-title" class="section-title">플레이 모드</h2>
            </div>
            <div id="mode-list" class="menu-list"></div>
          </section>
        </div>

        <aside class="home-side" aria-label="플레이 도구">
          <section class="home-block race-entry" aria-labelledby="race-title">
            <div class="block-head">
              <h2 id="race-title" class="section-title">내 기록과 달리기</h2>
            </div>
            <p class="block-note">같은 규칙의 최고 기록 리플레이와 같은 블록 순서로 겨뤄요</p>
            <div id="race-modes" class="tool-list"></div>
          </section>

          <section class="home-block" aria-labelledby="training-tools-title">
            <div class="block-head">
              <h2 id="training-tools-title" class="section-title">연습과 기록</h2>
            </div>
            <div class="tool-list">
              <button id="open-practice" class="tool-row" type="button"><span>연습</span><span data-icon="chevron-right"></span></button>
              <button id="open-records" class="tool-row" type="button"><span>기록</span><span data-icon="chevron-right"></span></button>
            </div>
          </section>

          <section class="home-block" aria-labelledby="replay-tools-title">
            <div class="block-head">
              <h2 id="replay-tools-title" class="section-title">리플레이</h2>
            </div>
            <div class="tool-list">
              <button id="watch-last" class="tool-row" type="button" disabled><span>마지막 판 다시 보기</span><small>저장된 판 없음</small><span data-icon="chevron-right"></span></button>
              <button id="open-replay" class="tool-row" type="button"><span>파일 열기</span><span data-icon="folder"></span></button>
            </div>
            <input id="replay-file" type="file" accept=".json,application/json" hidden />
          </section>

          <section class="home-block" aria-labelledby="data-tools-title">
            <div class="block-head">
              <h2 id="data-tools-title" class="section-title">데이터</h2>
            </div>
            <div class="tool-list">
              <button id="export-backup" class="tool-row" type="button"><span>백업 파일로 저장</span><span data-icon="download"></span></button>
              <button id="import-backup" class="tool-row" type="button"><span>백업 불러오기</span><span data-icon="folder"></span></button>
            </div>
            <input id="backup-file" type="file" accept=".json,application/json" hidden />
          </section>

          <p id="menu-notice" class="notice-slot menu-notice" role="status"></p>

          <details class="help-card">
            <summary id="help-title">조작법</summary>
            <p id="key-help" class="keys" aria-label="조작 안내"></p>
          </details>
        </aside>
      </section>

      <!-- 게임 화면: 첫 화면에서는 숨긴다 -->
      <section class="stage" aria-label="게임 화면">
        <!-- 정보 칸: 모드마다 필요한 칸만(게임 시작 때 정해지고 게임 중에는 그대로) -->
        <div class="stage-side">
          <dl class="hud">
            <div data-hud="time"><dt id="hud-time-label">시간</dt><dd id="hud-time">0:00.00</dd></div>
            <div data-hud="score"><dt>점수</dt><dd id="hud-score">0</dd></div>
            <div data-hud="level"><dt>레벨</dt><dd id="hud-level">1</dd></div>
            <div data-hud="lines"><dt id="hud-lines-label">줄</dt><dd id="hud-lines">0</dd></div>
            <div data-hud="pieces"><dt>피스</dt><dd id="hud-pieces">0</dd></div>
            <div data-hud="pps"><dt>PPS</dt><dd id="hud-pps">0.00</dd></div>
            <div data-hud="streak" class="is-off"><dt>연속 / 최고</dt><dd id="hud-streak">0 / 0</dd></div>
            <div data-hud="split"><dt>PB 대비</dt><dd id="hud-split" class="hud-split">—</dd></div>
            <div data-hud="attack" class="is-off"><dt>보낸 줄</dt><dd id="hud-attack">0</dd></div>
            <div data-hud="finesse" class="is-off"><dt>피네스 실수</dt><dd id="hud-finesse">0 / 0</dd></div>
          </dl>
          <aside id="race-panel" class="race-panel" aria-label="내 최고 기록 진행 상황" hidden>
            <div class="race-panel-head">
              <strong id="race-label">내 최고 기록</strong>
              <span id="race-progress-label" class="num">0 / 40줄</span>
            </div>
            <progress id="race-progress" aria-label="최고 기록 진행" value="0" max="40"></progress>
            <canvas id="race-board" class="race-board" aria-label="최고 기록 보드"></canvas>
          </aside>
          <aside id="versus-panel" class="race-panel versus-panel" aria-label="CPU 상황" hidden>
            <div class="race-panel-head">
              <strong id="versus-name">CPU</strong>
            </div>
            <canvas id="cpu-board" class="race-board cpu-board" aria-label="CPU 보드"></canvas>
            <dl class="versus-stats">
              <div><dt>CPU가 보낸 줄</dt><dd id="versus-cpu-sent" class="num">0</dd></div>
              <div><dt>CPU가 받을 쓰레기</dt><dd id="versus-cpu-incoming" class="num">0</dd></div>
            </dl>
          </aside>
        </div>

        <!-- 보드 주변 UI는 다크 표면을 사용한다. 플레이 격자의 색은 테마가 정한다. -->
        <div class="board-wrap surface-game">
          <canvas id="board" class="board" aria-label="보드"></canvas>
          <div id="countdown" class="countdown" aria-live="assertive" hidden><span id="countdown-label"></span></div>
          <div id="action" class="action" aria-live="polite"></div>

          <div id="pause" class="panel" hidden>
            <div class="panel-card">
              <h2 class="panel-title">일시정지</h2>
              <div class="actions">
                <button type="button" class="btn btn-primary" data-action="resume"><span data-icon="play"></span>계속 <kbd><kbd class="keycap">Esc</kbd></kbd></button>
                <button type="button" class="btn" data-action="retry"><span data-icon="restart"></span>다시 시작 <kbd data-key="RESTART"></kbd></button>
                <button type="button" class="btn" data-action="menu"><span data-icon="menu"></span>첫 화면으로</button>
              </div>
            </div>
          </div>

          <!-- 진행 중인 판을 버리기 전에 묻는다(R·로고). 기본 포커스는 "계속하기" — Space 연타로 넘어가지 않게 -->
          <div id="confirm" class="panel" hidden>
            <div class="panel-card confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
              <h2 id="confirm-title" class="panel-title"></h2>
              <p id="confirm-desc" class="confirm-desc">진행 중인 판은 기록되지 않고 사라져요.</p>
              <div class="actions-row">
                <button type="button" class="btn" data-confirm="cancel"><span data-icon="play"></span>계속하기 <kbd><kbd class="keycap">Esc</kbd></kbd></button>
                <button type="button" class="btn btn-primary" data-confirm="ok"><span class="confirm-ok-icon"></span><span class="confirm-ok-text">다시 시작</span> <kbd class="confirm-ok-key"></kbd></button>
              </div>
            </div>
          </div>

          <div id="results" class="panel" tabindex="-1" hidden>
            <div class="panel-card results-card">
              <p id="results-mode" class="results-mode"></p>
              <h2 id="results-title" class="panel-title"></h2>
              <p id="results-main" class="results-main"></p>
              <!-- 새 기록일 때만 보이지만 자리는 늘 차지한다(원칙 2) -->
              <p id="results-badge" class="badge is-invisible"><span data-icon="star"></span>새 기록</p>
              <p id="race-result" class="race-result"></p>
              <dl id="results-stats" class="results-stats"></dl>
              <details id="results-splits" class="results-splits">
                <summary>구간 기록</summary>
                <table>
                  <thead><tr><th scope="col">누적 줄</th><th scope="col">경과 시간</th><th scope="col">PB 대비</th></tr></thead>
                  <tbody id="results-split-rows"></tbody>
                </table>
                <p id="results-split-note"></p>
              </details>
              <div class="actions">
                <div class="actions-row">
                  <button type="button" class="btn btn-primary" data-action="retry"><span data-icon="restart"></span>다시 하기 <kbd data-key="RESTART"></kbd></button>
                  <button type="button" class="btn" data-action="menu"><span data-icon="menu"></span>첫 화면 <kbd><kbd class="keycap">Esc</kbd></kbd></button>
                </div>
                <div class="actions-row actions-row-3">
                  <button type="button" class="btn btn-small" data-action="stats"><span data-icon="chart"></span>통계</button>
                  <button type="button" class="btn btn-small" data-action="watch"><span data-icon="play"></span>다시 보기</button>
                  <button type="button" class="btn btn-small" data-action="export" aria-label="리플레이 파일로 저장" title="리플레이 파일로 저장"><span data-icon="download"></span>파일 저장</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 보드 아래 자리: 게임 중에는 터치 버튼, 리플레이 중에는 리플레이 조작 -->
        <div id="replay-bar" class="replay-bar" hidden>
          <div class="replay-info">
            <span class="replay-tag">REPLAY</span>
            <span id="replay-title" class="replay-title"></span>
            <span id="replay-status" class="replay-status"></span>
          </div>
          <p id="replay-note" class="replay-note" role="status"></p>
          <!-- 진행 막대: 눌러서 원하는 시점으로. 위에는 분석 표시(피네스 실수·오래 고민한 피스·주요 장면) -->
          <div class="replay-timeline">
            <div class="replay-track range">
              <div id="replay-markers" class="replay-markers"></div>
              <input id="replay-progress" type="range" min="0" max="1" step="1" value="0" aria-label="리플레이 위치" />
            </div>
            <span id="replay-time" class="num"></span>
          </div>
          <div class="replay-analysis">
            <button type="button" class="btn btn-small" data-replay="prev-mark" aria-label="이전 표시로"><span data-icon="arrow-left"></span>이전 표시</button>
            <p id="replay-summary" class="replay-summary"></p>
            <button type="button" class="btn btn-small" data-replay="next-mark" aria-label="다음 표시로">다음 표시<span data-icon="arrow-right"></span></button>
          </div>
          <div class="replay-buttons">
            <button type="button" class="btn" data-replay="toggle"><span class="replay-toggle-icon"><span data-icon="pause"></span></span><span class="replay-toggle-text">일시정지</span></button>
            <button type="button" class="btn num" data-replay="back" aria-label="5초 뒤로">-5초</button>
            <button type="button" class="btn num" data-replay="ahead" aria-label="5초 앞으로">+5초</button>
            <button type="button" class="btn num" data-replay="step-back" aria-label="한 프레임 뒤로">-1F</button>
            <button type="button" class="btn num" data-replay="step" aria-label="한 프레임 앞으로">+1F</button>
            <button type="button" class="btn num" data-replay="speed" aria-label="재생 속도 바꾸기"><span data-icon="forward"></span><span class="replay-speed">1x</span></button>
            <button type="button" class="btn" data-replay="restart"><span data-icon="restart"></span>처음부터</button>
            <button type="button" class="btn" data-replay="exit"><span data-icon="close"></span>닫기</button>
          </div>
        </div>
        <div id="touchpad" class="touchpad" aria-label="터치 조작">
          <button type="button" data-touch="HOLD" aria-label="홀드"><span data-icon="hold"></span></button>
          <button type="button" data-touch="CCW" aria-label="반시계 방향 회전"><span data-icon="rotate-ccw"></span></button>
          <button type="button" data-touch="R180" aria-label="180도 회전"><span data-icon="rotate-180"></span></button>
          <button type="button" data-touch="CW" aria-label="시계 방향 회전"><span data-icon="rotate-cw"></span></button>
          <button type="button" data-touch="PAUSE" aria-label="일시정지" class="touch-system"><span data-icon="pause"></span></button>
          <button type="button" data-touch="LEFT" aria-label="왼쪽 이동"><span data-icon="arrow-left"></span></button>
          <button type="button" data-touch="SOFT" aria-label="소프트 드롭"><span data-icon="arrow-down"></span></button>
          <button type="button" data-touch="HARD" aria-label="하드 드롭"><span data-icon="drop"></span></button>
          <button type="button" data-touch="RIGHT" aria-label="오른쪽 이동"><span data-icon="arrow-right"></span></button>
          <button type="button" data-touch="RESTART" aria-label="다시 시작" class="touch-system"><span data-icon="restart"></span></button>
        </div>
      </section>
    </main>
    <dialog id="settings" class="dialog" aria-label="설정"></dialog>
    <dialog id="rules-editor" class="dialog" aria-label="Custom 규칙"></dialog>
    <dialog id="records" class="dialog dialog-wide" aria-label="기록"></dialog>
    <dialog id="stats" class="dialog dialog-wide" aria-label="이번 판 통계"></dialog>
    <dialog id="practice" class="dialog" aria-label="연습"></dialog>
    <dialog id="versus" class="dialog" aria-label="CPU 대전"></dialog>
    <dialog id="daily" class="dialog" aria-label="오늘의 도전"></dialog>
    <!-- ES Modules: 개발용 실행은 http://localhost를 사용한다. -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
