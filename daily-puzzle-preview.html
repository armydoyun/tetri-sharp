<!doctype html>
<html lang="ko" data-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetri# · 오늘의 퍼즐 견본</title>
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/controls.css" />
    <link rel="stylesheet" href="./css/daily-puzzle-preview.css" />
  </head>
  <body>
    <main class="daily-sample">
      <header class="daily-sample-header">
        <span class="daily-sample-brand">Tetri<span>#</span></span>
        <h1>오늘의 퍼즐 견본</h1>
        <p id="sample-range"></p>
      </header>
      <div class="daily-sample-layout">
        <section class="daily-sample-panel" aria-labelledby="selected-family">
          <header class="daily-sample-selection">
            <div>
              <p id="selected-date" class="num"></p>
              <h2 id="selected-family"></h2>
            </div>
            <span id="selected-level" class="daily-sample-level"></span>
          </header>
          <div class="daily-sample-stage">
            <canvas id="sample-board" role="img"></canvas>
            <div class="daily-sample-info">
              <p id="selected-description"></p>
              <div>
                <h3>피스 순서</h3>
                <ol id="sample-pieces" class="num"></ol>
              </div>
              <dl id="selected-metrics"></dl>
            </div>
          </div>
          <div id="sample-actions" class="daily-sample-actions"></div>
          <div id="solution-controls" class="daily-sample-actions daily-sample-solution is-invisible"></div>
          <p id="solution-status" class="daily-sample-note" role="status"></p>
        </section>
        <section class="daily-sample-panel" aria-labelledby="calendar-title">
          <header class="daily-sample-list-head">
            <h2 id="calendar-title">날짜별 퍼즐</h2>
            <div id="sample-filter"></div>
          </header>
          <ol id="sample-days" class="daily-sample-days"></ol>
        </section>
      </div>
      <section class="daily-sample-panel daily-sample-audit" aria-labelledby="audit-title">
        <h2 id="audit-title">다양성 확인</h2>
        <dl id="sample-audit"></dl>
        <p>좌우 반전을 같은 판으로 세며, 같은 유형에서 두 칸 이하만 다른 판은 비슷한 판으로 셉니다. 난이도는 대표 풀이의 수, 기술, 첫 배치와 막다른 길을 함께 본 추정값입니다.</p>
        <p>대표 풀이를 비교할 때는 평행 이동과 좌우 반전을 같게 보면서 피스, 배치, 홀드, 지운 줄, 스핀을 비교합니다.</p>
        <p>첫 수 수치는 각 문제에 표시된 높이 안에서 90° 회전으로 도달할 수 있는 고정 위치를 비교한 값입니다.</p>
      </section>
    </main>
    <!-- ES Modules: 개발용 실행은 http://localhost를 사용한다. -->
    <script type="module" src="./js/daily-puzzle-preview/main.js"></script>
  </body>
</html>
